<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유저 인터렉션 속성</title>
    <script type="module">
      const button = document.querySelector('.voting-result-button');
      const results = document.querySelectorAll('.voting-result');

      button.addEventListener('click', () => {
        results.forEach((result) => {
          result.removeAttribute('hidden');
        });
      });
    </script>
  </head>
  <body>
    <a href="/index.html">메인 페이지로 이동</a>
    <br />
    <!-- 유저 인터렉션 관련 속성 -->
    <div class="voting-result-wrapper">
      <!-- accesskey로 실행할 때 MacOs는 Ctrl+Opt+<Key>, Windows는 Alt+<Key> (크롬 기준) -->
      <!-- 크롬 이외 웹브라우저는 MDN accesskey 안내 참고 -->
      <button type="button" class="voting-result-button" accesskey="P">
        피크타임 Top6 결과 보기
      </button>
      <div class="voting-result" hidden>
        <!--hidden = display:none -->
        <ol>
          <li>팀 11시 - VANNER</li>
          <li>팀 7시 - MASC</li>
          <li>팀 8시 - 다크비</li>
          <li>팀 24시 - B.A.P, 탑독, 비아이지, ARGON</li>
          <li>팀 13시 - BAE173</li>
          <li>팀 20시 - 몬트</li>
        </ol>
      </div>
      <div tabindex="0" class="voting-result" hidden>
        <!-- tabindex="0" 키보드 tab 선택 가능하도록 설정해줌 -->
        <ul class="voting-result-vedio">
          <li>
            <a href="https://vod.jtbc.co.kr/player/embed/VO10679813"
              >피크타임 1,2위 영상</a
            >
          </li>
          <li>
            <a
              href="https://vod.jtbc.co.kr/player/embed/VO10679810"
              tabindex="-1"
              >피크타임 3,4위 영상</a
            >
          </li>
          <li>
            <a href="https://vod.jtbc.co.kr/player/embed/VO10679807"
              >피크타임 5,6위 영상</a
            >
          </li>
        </ul>
      </div>
    </div>
    <figure>
      <img
        src="/src/assets/thumbnail/peaktime.jpeg"
        alt="피크타임 매주 수요일 밤 10시 30분 방송"
        width="680"
      />
      <figcaption class="user-caption" contenteditable>PEAK TIME</figcaption>
      <!-- contenteditable : 콘텐츠를 편집 할 수 있게 함 -->
    </figure>
  </body>
</html>
