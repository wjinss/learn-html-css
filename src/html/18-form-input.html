<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <a href="/index.html">메인 페이지 이동</a>
    <br />
    <h1>폼(input) 요소</h1>
    <form action="https://formspree.io/f/xeqwwbwk" method="POST">
      <!-- action = 폼을 보낼 "서버url" method = GET/POST -->
      <!-- 인풋(한줄 글상자) {search} - 검색어 입력서식 -->
      <!-- 폼 관련 요소는 모두 1:1로 대응되는 레이블을 가져야 함 -->
      <!-- name속성은 같은 분류, 카테고리라는걸 보여주는 속성 -->

      <!-- text: 텍스트 입력 서식 -->
      <div>
        <label for="userName">이름</label>
        <input type="text" id="userName" name="userName" />
      </div>
       <!-- password: 비밀번호 입력 서식 -->
      <div>
      <label for="userPassword">비밀번호</label>
        <input
          required 
          type="password" 
          id="userPassword" 
          name="userPassword" 
          />
      </div>
      <!-- search: 검색어 입력 서식 -->
      <div>
        <label for="searchKeyword">검색어</label>
        <input
          type="search"
          id="searchKeyword"
          placeholder="검색어를 입력하세요"
          name="keyword"
        />
      </div>

      <!-- tel : 전화번호 입력 서식 -->
      <label for="userTel">전화번호</label
        ><input type="tel" name="userTel" id="userTel" required />
      </div>
      <!-- email : 이메일 입력 서식 -->
      <div>
        <label for="userEmail">이메일</label
        ><input type="email" name="userEmail" id="userEmail" required />
        <!-- 줄바꿈을 하면 공백이 생기기 때문에 label의 태그 종료를 input 앞에서 종료되게 하는 프리티어 기능 -->
        <!-- required: 값이 없으면 서버로 넘어가지 않음 > 필수 체크해라~~ 하는 속성 -->
      </div>
      <!-- WAI-ARIA 이용 -->
      <div>
        <label for="userEmail1">이메일</label>
        <input type="email" name="userEmail" aria-labelledby="userEmail1" />
      </div>
      <!-- checkbox : 체크박스 서식 -->
      <div>
        <input
          type="checkbox"
          checked
          value="html"
          name="bootcamp"
          id="bootcampHtml"
        />
        <label for="bootcampHtml">html</label>
      </div>
      <div>
        <input type="checkbox" value="css" name="bootcamp" id="bootcampCss" />
        <label for="bootcampCss">css</label>
      </div>
      <!-- radio: 라디오 서식 -->
      <div>
        <label>
          <input type="radio" checked name="classRoom" value="classRoom1" />
          회고 1팀
        </label>
      </div>
      <div>
        <label>
          <input type="radio" name="classRoom" value="classRoom2" />
          회고 2팀
        </label>
      </div>
      <!-- 버튼(submit 전송, reset 초기화, 일반 버튼 button)  -->
      <div>
        <input type="submit" value="전송" />
        <input type="reset" value="초기화" />
        <input type="button" value="버튼" />
      </div>
    </form>
  </body>
</html>
