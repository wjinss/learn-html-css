<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>웹카페 로그인(폼 스타일)</title>
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />
    <link rel="preload" as="font" href="/public/font/suit/SUIT-Variable.woff2" />
    <link rel="stylesheet" href="/public/font/suit/SUIT-Variable.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/common/index.css" />
    <link rel="stylesheet" href="/src/ui/webcafe-login/webcafe-login.css" />
  </head>
  <body>
    <a href="/index.html">메인 페이지 이동</a>
    <br />
    <h1>웹카페 로그인(폼 스타일)</h1>
    <h2>컴포넌트 마크업</h2>
    <div class="component_wrapper">
      <!-- 입력 서식 컴포넌트 -->
      <div class="form_input"><label for="form_">폼 이름</label><input type="text" name="form_" id="form_" placeholder="예시" /></div>
      <!-- 버튼 컴포넌트 -->
      <button type="button" class="btn fill">
        <span>버튼 이름</span>
      </button>
      <button type="button" class="btn stroke">
        <span>버튼 이름</span>
      </button>

      <!-- 하이퍼링크 컴포넌트 -->
      <div class="icon_link">
        <span class="fa-solid fa-chevron-right"></span>
        <a href="#">링크 이름</a>
      </div>
    </div>
    <br /><br /><br /><br />
    <!-- 로그인 스타일링 -우진 -->
    <div>
      <h2>로그인</h2>
      <div class="login_wrapper">
        <div class="login_area">
          <form action="#" method="post">
            <div class="form_input"><label for="form_ID">아이디</label><input type="text" name="form_" id id="form_ID" placeholder="euid@gmail.com" /></div>
            <div class="form_input"><label for="form_PW">비밀번호</label><input type="password" name="form_PW" id="form_PW" placeholder="8자리 이상" /></div>
          </form>
          <button type="button" class="btn">
            <span>로그인</span>
          </button>
        </div>
        <div class="icon_link">
          <span class="fa-solid fa-chevron-right"></span>
          <a href="#">회원가입</a>
        </div>
        <div class="icon_link">
          <span class="fa-solid fa-chevron-right"></span>
          <a href="#">아이디 비밀번호 찾기</a>
        </div>
      </div>
    </div>
    <br /><br /><br /><br />
    <!-- 로그인 스타일링 -쎔 -->
    <h2>웹카페 로그인 폼</h2>
    <div class="webcafe_login">
      <h3 class="headline">로그인</h3>
      <form action="/" method="GET">
        <div class="form_input"><label for="form_ID">아이디</label><input type="email" name="form_ID1" id id="form_ID1" placeholder="euid@likelion.net" /></div>
        <div class="form_input"><label for="form_PW">비밀번호</label><input type="password" name="form_PW1" id="form_PW1" placeholder="8자리 이상" minlength="8" /></div>
        <button type="submit" class="btn fill">
          <span>로그인</span>
        </button>
      </form>
      <ul>
        <li>
          <div class="icon_link">
            <span class="fa-solid fa-chevron-right"></span>
            <a href="#">회원가입</a>
          </div>
        </li>
        <li>
          <div class="icon_link">
            <span class="fa-solid fa-chevron-right"></span>
            <a href="#">아이디 비밀번호 찾기</a>
          </div>
        </li>
      </ul>
    </div>
  </body>
</html>
