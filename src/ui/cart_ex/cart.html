<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="shortcut icon" href="/public/favicon/likelion.ico" type="image/x-icon" />
    <link rel="icon" href="/public/favicon/likelion.svg" type="image/svg" />

    <link rel="stylesheet" href="/public/font/suit/SUIT-Variable.css" />

    <link rel="stylesheet" href="./cart.css" />
  </head>
  <body>
    <div class="cart_contanier">
      <h3><img src=".//img/cart_svg.svg" alt="장바구니" />장바구니</h3>
      <ul>
        <li>
          <div class="item">
            <figure>
              <img
                src="./img/placeholder.jpg"
                alt="1a 우유 900ml"
                width="64"
                height="64
              "
              />
              <figcaption>
                <p class="item_name">1A 우유 900ml</p>
                <p class="item_price">1,870원</p>
              </figcaption>
            </figure>
            <div class="item_count">
              <button type="button" class="btn btn_min">-</button>
              <span>2</span>
              <button type="button" class="btn btn_plus">+</button>
            </div>
          </div>
        </li>
        <li>
          <div class="item">
            <figure>
              <img src="./img/placeholder2.jpg" alt="맛있는 콩나물 500g" width="64" height="64" />
              <figcaption>
                <p class="item_name">맛있는 콩나물 500g</p>
                <p class="item_price">1,280원</p>
              </figcaption>
            </figure>
            <div class="item_count">
              <button type="button" class="btn btn_min">-</button>
              <span>2</span>
              <button type="button" class="btn btn_plus">+</button>
            </div>
          </div>
        </li>
        <li>
          <div class="item">
            <figure>
              <img src="./img/placeholder3.jpg" alt="고소한 두부 1kg" width="64" height="64" />
              <figcaption>
                <p class="item_name">고소한 두부 1kg</p>
                <p class="item_price">2,210원</p>
              </figcaption>
            </figure>
            <div class="item_count">
              <button type="button" class="btn btn_min">-</button>
              <span>1</span>
              <button type="button" class="btn btn_plus">+</button>
            </div>
          </div>
        </li>
      </ul>
      <p class="all_price">구매 총액 : 8,600원</p>
    </div>
  </body>
</html>
